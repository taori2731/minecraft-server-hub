[package]
name = "minecraft-server-hub"
version = "0.3.8"
description = "A safe local Minecraft and Palworld dedicated server manager for Windows"
authors = ["Minecraft Server Hub contributors"]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.95"

[lib]
name = "minecraft_server_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
base64 = "0.22.1"
hex = "0.4.3"
futures-util = "0.3.31"
igd-next = "0.17.1"
local-ip-address = "0.6.9"
regex = "1.12.3"
reqwest = { version = "0.13.4", features = ["json", "stream", "query"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.10.6"
sha2 = "0.10.9"
sysinfo = "0.39.6"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2.10.1"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["macros", "process", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
playit-ipc = { git = "https://github.com/playit-cloud/playit-agent", tag = "v1.0.10", package = "playit-ipc" }
uuid = { version = "1.22.0", features = ["v4", "serde"] }
walkdir = "2.5.0"
zip = { version = "8.4.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
minisign-verify = "0.2.5"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading"
] }
