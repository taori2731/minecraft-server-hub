name: Sign Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Must exactly match package.json"
        required: true
        type: string
      release_tag:
        description: "Release tag in minecraft-server-hub-releases, for example v0.3.10"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: sign-windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check release and signing configuration
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fail closed when release inputs or secrets are missing
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REF -ne "refs/heads/main") {
            throw "Signing is allowed only from the main branch. Ref: $env:GITHUB_REF"
          }
          $package = Get-Content -LiteralPath "package.json" -Raw | ConvertFrom-Json
          if ([string]$package.version -ne $env:RELEASE_VERSION) {
            throw "workflow version does not match package.json"
          }
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw "release-tag must be a version tag such as v0.3.10"
          }
          $required = @{
            TAURI_SIGNING_PRIVATE_KEY = $env:TAURI_SIGNING_PRIVATE_KEY
            SIGNPATH_API_TOKEN = $env:SIGNPATH_API_TOKEN
            SIGNPATH_ORGANIZATION_ID = $env:SIGNPATH_ORGANIZATION_ID
            SIGNPATH_PROJECT_SLUG = $env:SIGNPATH_PROJECT_SLUG
            SIGNPATH_SIGNING_POLICY_SLUG = $env:SIGNPATH_SIGNING_POLICY_SLUG
          }
          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace([string]$_.Value) } | ForEach-Object { $_.Key })
          if ($missing.Count -gt 0) {
            throw "Signing configuration is incomplete: $($missing -join ', ')"
          }
          Write-Output "Release preflight passed for version $env:RELEASE_VERSION. Secret contents were not displayed."

  build-and-sign:
    name: Build, approve, sign, and verify
    needs: preflight
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Build the unsigned Tauri NSIS installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles nsis --ci

      - name: Locate exactly one unsigned installer
        id: locate_unsigned
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(Get-ChildItem -LiteralPath "src-tauri/target/release/bundle/nsis" -Filter "*_x64-setup.exe" -File)
          if ($files.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($files.Count)."
          }
          "path=$($files[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload the unsigned installer for origin verification
        id: upload_unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-installer-${{ inputs.version }}
          path: ${{ steps.locate_unsigned.outputs.path }}
          archive: false

      - name: Submit the signing request and wait for manual approval
        id: signpath
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload_unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          skip-decompress: true

      - name: Replace the installer with the returned Authenticode-signed artifact
        id: locate_signed
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $signed = @(Get-ChildItem -LiteralPath "signed" -Filter "*.exe" -File -Recurse)
          if ($signed.Count -ne 1) {
            throw "Expected exactly one signed installer from SignPath, found $($signed.Count)."
          }
          $releaseDir = Join-Path $PWD "artifacts/release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $destination = Join-Path $releaseDir $signed[0].Name
          Copy-Item -LiteralPath $signed[0].FullName -Destination $destination -Force
          "path=$destination" >> $env:GITHUB_OUTPUT

      - name: Re-sign the final bytes for the Tauri updater
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- signer sign "${{ steps.locate_signed.outputs.path }}"

      - name: Verify Authenticode, Tauri updater signature, and checksums
        shell: pwsh
        env:
          MSH_UPDATER_ARTIFACT: ${{ steps.locate_signed.outputs.path }}
        run: |
          $ErrorActionPreference = "Stop"
          $installer = $env:MSH_UPDATER_ARTIFACT
          $authenticode = Get-AuthenticodeSignature -LiteralPath $installer
          if ([string]$authenticode.Status -ne "Valid") {
            throw "Authenticode verification failed: $($authenticode.Status)"
          }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib app_update::tests::verifies_a_built_updater_with_the_embedded_public_key -- --ignored
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToUpperInvariant()
          $size = (Get-Item -LiteralPath $installer).Length
          "$hash  $(Split-Path -Leaf $installer)" | Set-Content -LiteralPath "artifacts/release/SHA256SUMS.txt" -Encoding ascii
          Write-Output "Verified Authenticode status: $($authenticode.Status)"
          Write-Output "Verified installer size: $size bytes"
          Write-Output "Installer SHA-256: $hash"

      - name: Create the Tauri updater manifest
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem -LiteralPath "artifacts/release" -Filter "*.exe" -File | Select-Object -First 1
          if ($null -eq $installer) {
            throw "Signed installer was not found."
          }
          $assetName = [Uri]::EscapeDataString($installer.Name)
          $downloadUrl = "https://github.com/taori2731/minecraft-server-hub-releases/releases/download/$env:RELEASE_TAG/$assetName"
          & .\scripts\create-update-manifest.ps1 -Version $env:RELEASE_VERSION -DownloadUrl $downloadUrl -InstallerPath $installer.FullName -Notes "Signed Windows release $env:RELEASE_VERSION" -OutputPath "artifacts/release/latest.json"

      - name: Upload the reviewed signed release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-release-${{ inputs.version }}
          path: artifacts/release
          archive: true
